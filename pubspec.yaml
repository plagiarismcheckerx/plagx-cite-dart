name: plagx_cite
description: >-
  Free APA and MLA citation generator and reference checker: reference lists, in-text citations,
  BibTeX import/export, DOI to citation and duplicate reference detection. By Plagiarism Checker X.
version: 0.2.1
homepage: https://plagiarismcheckerx.github.io/plagx-cite/
repository: https://github.com/plagiarismcheckerx/plagx-cite-dart
issue_tracker: https://github.com/plagiarismcheckerx/plagx-cite-dart/issues
topics:
  - citation
  - bibliography
  - bibtex
  - doi
  - academic

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0
  unorm_dart: ^0.3.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

executables:
  plagx-cite: plagx_cite
